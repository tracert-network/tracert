name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    name: registry — validate + build exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: registry
      - run: npm run build
        working-directory: registry

  router:
    name: router — build + end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: router
      # The smoke test spawns the stdio server, which reads ../registry — the
      # whole repo is checked out, so the sibling path resolves in CI.
      - run: npm test
        working-directory: router

  site:
    name: site — static build from the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  # No humans in the loop: a submission PR (branch submit/*) that passes all
  # three checks above is squash-merged automatically. Uses a PAT secret
  # (TRACERT_MERGE_TOKEN, contents+PR write) rather than GITHUB_TOKEN, because
  # the org locks the default workflow token to read-only. Skips safely — never
  # blocks — until that secret is set. Same-repo submissions only (the no-fork
  # submission API opens them); fork PRs don't receive secrets, so they can't
  # trigger a merge.
  automerge:
    name: auto-merge validated submissions
    needs: [registry, router, site]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'submit/')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge if all checks passed
        env:
          GH_TOKEN: ${{ secrets.TRACERT_MERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TRACERT_MERGE_TOKEN not set — auto-merge disabled; leaving PR #$PR for manual merge."
            exit 0
          fi
          echo "All checks green — squash-merging submission PR #$PR."
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
