# Unofficial, FREE wrapper of a third-party public API. Maintained by Tracert;
# not affiliated with or endorsed by TinyURL. This capability performs a PUBLIC WRITE.
schema: https://tracert.site/schemas/manifest/v0.1

provider:
  id: tinyurl
  name: TinyURL
  url: https://tinyurl.com
  operator: tinyurl

service:
  id: tinyurl-create
  name: TinyURL create API
  url: https://tinyurl.com

capability:
  id: tinyurl.shorten-url
  version: 0.1.0
  status: active
  promise: Create a short tinyurl.com link that redirects to a supplied long URL.
  description: >-
    Community-maintained Tracert listing of TinyURL's keyless create endpoint.
    Given a long URL, returns a short tinyurl.com link that publicly redirects
    to it; an optional custom keyword may be requested. This is a WRITE that
    creates a durable public artifact (the short link). The same long URL always
    yields the same short link (TinyURL dedupes), so the write is idempotent.
    The submitted URL becomes publicly resolvable, so never include secrets,
    tokens or private query parameters.
    Example - GET /api-create.php?url=https://tracert.site returns https://tinyurl.com/28y67wky (text/plain).
    Not affiliated with or endorsed by TinyURL.
  tags: [url-shortener, links, redirect, short-url, free, wrapper, unofficial]
  excludes:
    - Click analytics or statistics
    - Guaranteed permanence of the short link
    - Custom branded domains
  input:
    schema_ref: ../schemas/shorten-url.input.schema.json
    media_types: [application/json]
    max_bytes: 4096
    notes: Sent as URL query parameters on a GET (url, optional alias), not a request body.
  output:
    schema_ref: ../schemas/shorten-url.output.schema.json
    media_types: [text/plain]
    notes: The response body is the short URL as plain text (or an error string on failure).
  errors:
    - code: invalid_input
      meaning: The URL was missing or malformed, or a requested custom keyword was already taken.
      retriable: false
    - code: unavailable
      meaning: The TinyURL API was unreachable or returned an error.
      retriable: true
  interfaces:
    - type: native_api
      endpoint: https://tinyurl.com/api-create.php
      notes: GET with query params url (required) and optional alias (custom keyword). Returns the short URL as text/plain. No account or key required.
  pricing:
    free: true
    mode: free
  operations:
    expected_latency_seconds: { p50: 0.5, p95: 2 }
    timeout_seconds: 15
    idempotency: supported
    rate_limits: Keyless endpoint; heavy automated use may be throttled.
  data_policy:
    input_retention:
      policy: indefinite
      notes: The submitted long URL is stored indefinitely as the redirect target for the life of the short link, and becomes publicly resolvable.
    training_use: undisclosed
    regions: [global]
    subprocessors:
      - TinyURL (upstream provider)
    notes: >-
      Unofficial free wrapper. This capability performs a PUBLIC WRITE - the
      short link and its target are publicly accessible. Never submit URLs that
      contain credentials or private parameters. training_use is marked
      "undisclosed" where the provider has not declared it.
  provenance:
    integration_status: unofficial
    adapter_operator: tracert-labs
    notes: Listing maintained by Tracert. Not affiliated with or endorsed by TinyURL.
