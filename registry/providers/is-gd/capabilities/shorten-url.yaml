# Unofficial, FREE wrapper of a third-party public API. Maintained by Tracert;
# not affiliated with or endorsed by is.gd. This capability performs a PUBLIC WRITE.
schema: https://tracert.site/schemas/manifest/v0.1

provider:
  id: is-gd
  name: is.gd
  url: https://is.gd
  operator: is-gd

service:
  id: is-gd-api
  name: is.gd URL Shortener API
  url: https://is.gd

capability:
  id: is-gd.shorten-url
  version: 0.1.0
  status: active
  promise: Create a short is.gd link that redirects to a supplied long URL.
  description: >-
    Community-maintained Tracert listing of the is.gd URL-shortening API. Given
    a long URL, returns a short is.gd link that publicly redirects to it; an
    optional custom code may be requested. This is a WRITE that creates a
    durable public artifact (the short link) - the closest instant analog to a
    directory listing. The submitted URL becomes publicly resolvable, so never
    include secrets, tokens or private query parameters.
    Example - GET /create.php?format=json&url=https://tracert.site/capabilities returns { "shorturl": "https://is.gd/..." }.
    Not affiliated with or endorsed by is.gd.
  tags: [url-shortener, links, redirect, short-url, free, wrapper, unofficial]
  excludes:
    - Click analytics or statistics
    - Guaranteed permanence of the short link
    - Custom branded domains
  input:
    schema_ref: ../schemas/shorten-url.input.schema.json
    media_types: [application/json]
    max_bytes: 4096
    notes: Sent as URL query parameters on a GET (url, format, optional shorturl), not a request body.
  output:
    schema_ref: ../schemas/shorten-url.output.schema.json
    media_types: [application/json]
  errors:
    - code: invalid_input
      meaning: The URL was missing or malformed, or a requested custom code was already taken or too short.
      retriable: false
    - code: unsupported
      meaning: The URL was rejected by the provider (blocked or flagged as abusive).
      retriable: false
    - code: rate_limited
      meaning: The provider's anti-abuse rate limit was hit.
      retriable: true
    - code: unavailable
      meaning: The is.gd API was unreachable.
      retriable: true
  interfaces:
    - type: native_api
      endpoint: https://is.gd/create.php
      docs_url: https://is.gd/apishorteningreference.php
      notes: GET with query params url (required), format=json, optional shorturl (custom code). Creates a public redirect.
  pricing:
    free: true
    mode: free
  operations:
    expected_latency_seconds: { p50: 0.4, p95: 2 }
    timeout_seconds: 15
    idempotency: not_supported
    rate_limits: Per-IP anti-abuse limits apply; excessive requests are throttled.
  data_policy:
    input_retention:
      policy: indefinite
      notes: The submitted long URL is stored indefinitely as the redirect target for the life of the short link, and becomes publicly resolvable.
    training_use: undisclosed
    regions: [global]
    subprocessors:
      - is.gd (upstream provider)
    notes: >-
      Unofficial free wrapper. This capability performs a PUBLIC WRITE - the
      short link and its target are publicly accessible. Idempotency is not
      supported: repeated calls may mint new links. Never submit URLs that
      contain credentials or private parameters.
  provenance:
    integration_status: unofficial
    adapter_operator: tracert-labs
    notes: Listing maintained by Tracert. Not affiliated with or endorsed by is.gd.
